name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
      - CLIENTS_AMOUNT=3
    volumes: 
      - ./server/config.ini:/config.ini
    networks: 
      - testing_net
  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
    networks: 
      - testing_net
    depends_on:
      - server
    volumes:
      - ./.data/agency-1.csv:/agency.csv
      - ./client/config.yaml:/config.yaml
  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
    networks: 
      - testing_net
    depends_on:
      - server
    volumes:
      - ./.data/agency-2.csv:/agency.csv
      - ./client/config.yaml:/config.yaml
  client3:
    container_name: client3
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=3
    networks: 
      - testing_net
    depends_on:
      - server
    volumes:
      - ./.data/agency-3.csv:/agency.csv
      - ./client/config.yaml:/config.yaml

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
